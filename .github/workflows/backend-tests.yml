name: Backend Tests CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio anyio pydantic pydantic-settings fastapi sqlalchemy PyPDF2 python-docx openai google-generativeai slowapi alembic

      - name: Run Pytest Suite
        run: |
          cd backend
          PYTHONPATH=. python -m pytest -v -m "not integration"
